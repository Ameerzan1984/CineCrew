name: CineMesh CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [cinemesh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinemesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinemesh
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: cinemesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinemesh -d cinemesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://cinemesh:disposable-ci-password@127.0.0.1:5432/cinemesh
      CINEMESH_TEST_DATABASE_URL: postgresql://cinemesh:disposable-ci-password@127.0.0.1:5432/cinemesh
      CINEMESH_TEST_POSTGRES_URL: postgresql://cinemesh:disposable-ci-password@127.0.0.1:5432/cinemesh
      CINEMESH_TEST_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      CHATGPT_REDIRECT_URI: http://127.0.0.1:3000/api/connections/chatgpt/callback
      FILM_ENGINE_URL: http://127.0.0.1:8001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out CineCrew and CineMesh
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            services/film-engine/requirements.txt
            services/generation-worker/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Create ephemeral test-only credentials
        shell: bash
        run: |
          engine_token="$(openssl rand -hex 32)"
          chatgpt_vault_key="$(openssl rand -base64 32 | tr -d '\n')"
          higgsfield_vault_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$engine_token"
          echo "::add-mask::$chatgpt_vault_key"
          echo "::add-mask::$higgsfield_vault_key"
          {
            echo "FILM_ENGINE_SERVICE_TOKEN=$engine_token"
            echo "CHATGPT_VAULT_KEY=$chatgpt_vault_key"
            echo "HIGGSFIELD_VAULT_KEY=$higgsfield_vault_key"
            echo "CINEMESH_ENGINE_DB=$RUNNER_TEMP/cinemesh-film-engine.sqlite3"
            echo "CINEMESH_MEDIA_DIR=$RUNNER_TEMP/cinemesh-media"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cinemesh-media"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install CineCrew, engine, and scheduler dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r services/film-engine/requirements.txt -r services/generation-worker/requirements.txt

      - name: Test web units, types, and production build
        working-directory: apps/web
        run: |
          npm run test:unit
          npm run lint
          npm run build

      - name: Test provider adapters
        working-directory: packages/providers
        run: npm test

      - name: Apply the web and generation scheduler migrations
        run: |
          cd apps/web
          npm run db:migrate
          cd ../..
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f services/generation-worker/migrations/001_scheduler.sql

      - name: Test CineCrew engine, generation scheduling, and rendering
        run: |
          (cd services/film-engine && CINEMESH_TEST_ENGINE_DATABASE_URL="$DATABASE_URL" python -m pytest -q)
          (cd services/generation-worker && python -m pytest -q tests)
          (cd services/render-worker && python -m pytest -q test_render.py)

      - name: Start the private film engine
        shell: bash
        run: |
          cd services/film-engine
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/film-engine.log" 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/film-engine.log"; exit 1; fi

      - name: Start the local web application
        shell: bash
        run: |
          cd apps/web
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/cinemesh-web.log" 2>&1 &
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/auth/me > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/cinemesh-web.log"; exit 1; fi

      - name: Run PostgreSQL-backed auth, film, collaboration, and publication tests
        working-directory: apps/web
        run: npm run test:integration && npm run test:continuation

      - name: Install Chromium for desktop and mobile E2E
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser persistence and RTL E2E
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinemesh-e2e-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
